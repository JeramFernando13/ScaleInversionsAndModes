<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale Maggiori — Posizioni & Modi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <h1>Scale Maggiori</h1>
      <span class="key-badge" id="key-badge">G MAJ</span>
    </div>
    <div class="subtitle" id="scale-subtitle">G · A · B · C · D · E · F#</div>
  </header>

  <div class="root-section">
    <div class="section-label">Root note</div>
    <div class="root-grid" id="root-grid"></div>
  </div>

  <div class="view-toggle">
    <button class="view-btn active" onclick="setView('pos')">Posizioni</button>
    <button class="view-btn" onclick="setView('modi')">Modi</button>
  </div>

  <div id="view-pos">
    <div class="tabs-section">
      <div class="section-label">Forma</div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="content"></div>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#1a2e1a;border:1.5px solid #3d7a3d"></div>Root</div>
      <div class="leg"><div class="leg-dot" style="background:#242422;border:1px solid #3a3a37"></div>Nota scala</div>
      <div class="leg" style="color:#55534e">T = tono (2 fret) · s = semitono (1 fret)</div>
    </div>
  </div>

  <div id="view-modi" style="display:none">
    <div id="modes-content"></div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
